# Deploys this repo to a Hugging Face Space on every push to main.
# Setup (once): in GitHub → Settings → Secrets and variables → Actions
#   - Secret   HF_TOKEN  = a Hugging Face token with WRITE access
#   - Variable HF_SPACE  = <your-hf-username>/<space-name>, e.g. sara/CallCenterAi
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::Set the HF_TOKEN secret and HF_SPACE variable to enable deploys."
            exit 0
          fi
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
